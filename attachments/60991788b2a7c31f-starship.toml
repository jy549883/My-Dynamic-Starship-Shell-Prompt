zone7bg = '#A30000'



[line_break]
disabled = false

[fill]
disabled = false
symbol = ' '
#style = 'bg:prev_bg'
style = 'bg:prev_bg'
#format = '[$symbol]($style)'



##### Line 1 #####
[cmd_duration]
disabled = false
min_time = 0
show_milliseconds = true
style = ''
format = '[$duration](fg:text)'

[status]
disabled = false
symbol = '🔴 FAIL'
success_symbol = '🟢 SUCCESS '
sigint_symbol = ' INTURRUPTED '
map_symbol = true
style = 'text'
success_style = 'green'
failure_style = 'red'
format = '[$status/$hex_status $symbol$common_meaning$signal_name]($style)'

[directory]
truncation_length = 15
read_only = ' 🔒'
truncation_symbol = '/.../'
style = 'bold directory'
read_only_style = 'bold red'
format = 'Path: [$path$read_only]($style)'

[time]
disabled = false
use_12hr = true
time_format = '%A %-e %B %Y, %-I:%M:%S%P'
style = ''
format = '$time'



##### Line 2 #####
[container]
## zone2
symbol = '📦'
style = ''
format = '$symbol $name'

[memory_usage]
## zone3
disabled = false
threshold = 0
symbol = ''
style = ''
format = '$symbol${ram_pct}\(${swap_pct}\)'

[git_branch]
## zone4
symbol = ''
style = ''
format = '$symbol$branch(:$remote_branch)'

[git_status]
## zone4
style = ''
format = '$all_status$ahead_behind'

[package]
disabled = false
symbol = '🎁'
version_format = 'v${raw}'
display_private = true
style = ''
format = '$symbol $version'

[username]
## zone5
show_always = true
#aliases = { "jy549883" = "Jeff️", "root" = "ROOT" }
aliases = { "root" = "ROOT" }
style_root = 'bold underline zone5fg_root bg:prev_bg'
style_user = 'bold fg:zone5fg_user bg:prev_bg'
format = '[$user]($style)'

[hostname]
## zone5
ssh_only = false
ssh_symbol = '🌐'
trim_at = ''
style = ''
format = '$ssh_symbol$hostname'

[hostname.aliases]
name = 'name'

[localip]
disabled = false
ssh_only = false
style = ''
format = '$localipv4'



##### Line 3 #####
[jobs]
number_threshold = 0
symbol_threshold = 0
symbol = ''
style = ''
format = '$symbol$number'

[shell]
disabled = false
bash_indicator = 'BASH'
fish_indicator = 'FISH'
zsh_indicator = 'ZSH'
style = ''
format = '$indicator'

[sudo]
disabled = false
symbol = '💥'
style = ''
format = '[$symbol](red)'

# I am wanting to have a functional [os] module, and what is currently used in Starship is not functional.
# So I am implementing a workaround for this by setting custom environment variables STARSHIP_OS_NAME,
# STARSHIP_OS_VERSION, STARSHIP_OS_EDITION, STARSHIP_OS_CODENAME, STARSHIP_OS_TYPE, and STARSHIP_OS_SYMBOL
# to the correct values.  Each distribution includes this information in the /etc/os-release file.
# See [Starship Issue #6902](https://github.com/starship/starship/issues/6902)

[env_var.STARSHIP_OS_SYMBOL]
disabled = false
symbol = ''
default = 'The OS Symbol'
#variable = 'STARSHIP_OS_SYMBOL'
style = 'none'
format = '$symbol$env_value'
description	= 'A workaround for the [os] module symbol variable.'

[env_var.STARSHIP_OS_NAME]
disabled = false
symbol = ''
default = 'The OS Name'
#variable = 'STARSHIP_OS_NAME'
style = 'none'
format = '$symbol$env_value'
description	= 'A workaround for the [os] module name variable.'

[env_var.STARSHIP_OS_VERSION]
disabled = false
symbol = ''
default = 'The OS Version'
#variable = 'STARSHIP_OS_VERSION'
style = 'none'
format = '$symbol$env_value'
description	= 'A workaround for the [os] module version variable.'

[env_var.STARSHIP_OS_EDITION]
disabled = false
symbol = ''
default = 'The OS Edition'
#variable = 'STARSHIP_OS_EDITION'
style = 'none'
format = '$symbol$env_value'
description	= 'A workaround for the [os] module edition variable.'

[env_var.STARSHIP_OS_CODENAME]
disabled = false
symbol = ''
default = 'The OS Codename'
#variable = 'STARSHIP_OS_CODENAME'
style = 'none'
format = '$symbol$env_value'
description	= 'A workaround for the [os] module codename variable.'

[env_var.STARSHIP_OS_TYPE]
disabled = false
symbol = ''
default = 'The OS Type'
#variable = 'STARSHIP_OS_TYPE'
style = 'none'
format = '$symbol$env_value'
description	= 'A workaround for the [os] module type variable.'

