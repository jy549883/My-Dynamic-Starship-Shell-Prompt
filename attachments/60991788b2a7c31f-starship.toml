# ~/.config/starship.toml
palette = 'default'

add_newline = true
command_timeout = 500
format = """\
[\
[┏━$cmd_duration](fg:powerbar) $status $fill $directory ($package )$fill $time\
$line_break\
[┣━](fg:powerbar)\
[[](fg:zone1bg bg:none) ${custom.os} ${env_var.STARSHIP_OS_SYMBOL} ${env_var.STARSHIP_OS_NAME} ${env_var.STARSHIP_OS_VERSION} (\\(${env_var.STARSHIP_OS_TYPE}\\) )](fg:zone1fg bg:zone1bg)\
[[](fg:zone1bg bg:zone2bg) $container ](fg:zone2fg bg:zone2bg)\
[[](fg:zone2bg bg:zone3bg) $memory_usage ](fg:zone3fg bg:zone3bg)\
[[](fg:zone3bg bg:zone4bg) $fill $git_status $git_branch $package $fill [](fg:zone5bg bg:zone4bg)](bold fg:zone4fg bg:zone4bg)\
[ $username [](fg:zone6bg bg:zone5bg)](bg:zone5bg)\
[ $hostname [](fg:zone7bg bg:zone6bg)](fg:zone6fg bg:zone6bg)\
[ $localip [](fg:zone7bg bg:none)](fg:zone7fg bg:zone7bg)\
$line_break\
[┗━━[$jobs](fg:text)](fg:powerbar) $shell($sudo)[❯](fg:powerbar)\
](fg:text bg:none)\
"""


[palettes.default]
powerbar = '#D1B200'
text = 'green'
directory = '#C9CD03'
zone1fg = '#969696'
zone1bg = '#525252'
zone2fg = '#000000'
